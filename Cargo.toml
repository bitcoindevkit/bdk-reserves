[package]
name = "bdk-reserves"
version = "3.0.0"
authors = ["Richard Ulrich <richard.ulrich@aminagroup.com>"]
edition = "2024"
description = "Proof of reserves for bitcoin dev kit"
keywords = ["proof", "reserves", "bitcoin", "psbt"]
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitcoindevkit/bdk-reserves"

[dependencies]
bdk_wallet = { version = "3.0", default-features = false, features = ["std"] }
bitcoinconsensus = "0.105"
log = "^0.4"

# same version as in rust-bitcoin - I couldn't find a re-export
units = { package = "bitcoin-units", version = "0.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
rstest = "^0.11"
bdk_wallet = { version = "3.0", default-features = true, features = ["test-utils"] }
bdk_electrum = "0.24"
electrsd = { version = "0.39", features = ["download", "bitcoind_download", "bitcoind_29_0", "electrs_0_10_6"] }